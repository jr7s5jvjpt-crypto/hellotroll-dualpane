name: DualPane
options:
  bundleIdPrefix: com.dualpane
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"

targets:
  DualPane:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
    scheme:
      testTargets: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dualpane.app
        PRODUCT_NAME: DualPane
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_ENTITLEMENTS: ""
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_BITCODE: NO
        ONLY_ACTIVE_ARCH: NO
        ARCHS: "arm64"
